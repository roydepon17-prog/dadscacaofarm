name: Assemble OGuia cacao background image

on:
  push:
    paths:
      - "assets/oguia-cacao-base64/**"
      - ".github/workflows/assemble-cacao-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble image
        run: |
          cat assets/oguia-cacao-base64/part-*.txt | tr -d '\n' | base64 -d > public/images/oguia-cacao-background.jpg
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/oguia-cacao-background.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Add edited cacao background image"
            git push
          fi
