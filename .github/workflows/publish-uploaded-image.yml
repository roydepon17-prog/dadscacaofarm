name: Publish uploaded image artifact

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "GitHub Actions run ID containing the uploaded image artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name containing the image file"
        required: true
        default: "uploaded-image"
        type: string
      target_path:
        description: "Repository path for the image, e.g. public/images/cacao-pods.jpg"
        required: true
        default: "public/images/uploaded-image.jpg"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          mkdir -p /tmp/uploaded-image
          gh run download "$RUN_ID"             --name "$ARTIFACT_NAME"             --dir /tmp/uploaded-image

      - name: Locate uploaded image
        id: image
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          set -euo pipefail
          file="$(find /tmp/uploaded-image -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | head -n 1)"
          if [ -z "$file" ]; then
            echo "No supported image file found in artifact." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$TARGET_PATH")"
          cp "$file" "$TARGET_PATH"
          echo "path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: Commit image to repository
        env:
          TARGET_PATH: ${{ steps.image.outputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "Add uploaded image"
          git push
